<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inmobiliaria Taller de Proyectos 2 - 2025</title>
  <link rel="stylesheet" href="build/css/app.css">
  <link rel="stylesheet" href="build/css/administracion.css">
</head>

<body>

  <header class="header">
    <div class="contenedor contenido-header">
      <div class="barra">
        <a href="index.html">
          <img src="build/img/Tallerlogo.svg" alt="Logotipo de Kennedy">
        </a>

        <div class="mobile-menu">
          <img src="build/img/barras.svg" alt="icono menu responsive">
        </div>

        <div class="derecha">
          <img class="dark-mode-boton" src="build/img/dark-mode.svg">
          <nav class="navegacion">
            <a href="index.html">Página Principal</a>
          </nav>
        </div>

      </div> <!--.barra-->
    </div>
  </header>

  <main class="contenedor seccion" >
    <div id="pantallaprovincias">
      <nav style="margin:12px 0;">
        <button data-view="provincias">Provincias</button>
        <button data-view="partidos">Partidos</button>
        <button data-view="calles">Calles</button>
        <button data-view="codigos">Códigos Postales</button>
        <button data-view="direcciones">Direcciones</button>
        <button data-view="inmuebles">Inmuebles</button>
      </nav>

      <div id="abm-container">
        <!-- Contenedores por entidad -->
        <section id="view-provincias" class="abm-view" style="display:none;"></section>
        <section id="view-partidos" class="abm-view" style="display:none;"></section>
        <section id="view-calles" class="abm-view" style="display:none;"></section>
        <section id="view-codigos" class="abm-view" style="display:none;"></section>
        <section id="view-direcciones" class="abm-view" style="display:none;"></section>
        <section id="view-inmuebles" class="abm-view" style="display:none;"></section>
      </div>

    </div>
  </main>



  <footer class="footer seccion">
    <div class="contenedor contenedor-footer">
      <nav class="navegacion">
        <a href="nosotros.html">Nosotros</a>
        <a href="anuncios.html">Anuncios</a>
        <a href="blog.html">Blog</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>

    <p class="copyright">Todos los derechos Reservados 2025 &copy;</p>
  </footer>

  <script src="build/js/bundle.min.js"></script>
  <script src="./src/js/administracion.js"></script>
</body>

</html>
